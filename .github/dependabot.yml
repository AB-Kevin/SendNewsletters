version: 2
updates:
  # Keep GitHub Actions (actions/checkout, actions/setup-node, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep npm dependencies (electron, electron-builder, ...) current.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # SheetJS is installed from cdn.sheetjs.com because the npm registry copy
      # is outdated and has known vulnerabilities. Dependabot can't update it;
      # see the README for how to update it by hand.
      - dependency-name: xlsx

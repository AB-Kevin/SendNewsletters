name: Release

# Builds the Windows (.exe) installer and publishes it to the GitHub Release
# for the pushed tag.
#
# Usage: bump "version" in package.json, commit, then:
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The create-release job pre-creates the release before the build job runs,
# working around a known electron-builder bug (electron-userland/electron-builder
# #6676) where its "does a release already exist for this tag" lookup can
# race/miss right after creating one, creating a SECOND release with the same
# tag and splitting assets (the .exe and .exe.blockmap) across both. With the
# release already fully existing before electron-builder's --publish step
# runs, there's no create race left for it to lose.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure a GitHub Release exists for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes ""
          fi

  release-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & publish (Windows)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
